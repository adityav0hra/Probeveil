apiVersion: v1
kind: Namespace
metadata: { name: probeveil }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: probeveil-web, namespace: probeveil }
spec:
  replicas: 2
  selector: { matchLabels: { app: probeveil-web } }
  template:
    metadata: { labels: { app: probeveil-web } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: probeveil:1.0.0
          ports: [{ containerPort: 3000 }]
          envFrom: [{ secretRef: { name: probeveil-secrets } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          readinessProbe: { httpGet: { path: /login, port: 3000 }, initialDelaySeconds: 5 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: probeveil-passive-worker, namespace: probeveil }
spec:
  replicas: 2
  selector: { matchLabels: { app: probeveil-passive-worker } }
  template:
    metadata: { labels: { app: probeveil-passive-worker } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: probeveil-worker:1.0.0
          envFrom: [{ secretRef: { name: probeveil-worker-secrets } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 300m, memory: 256Mi }, limits: { cpu: "1500m", memory: 512Mi } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: probeveil }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
